name: Importer les sources Synapse

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire les sources
        run: |
          unzip -o Synapse-by-MaTows-source-v2.zip -d .
          rm Synapse-by-MaTows-source-v2.zip
          rm .github/workflows/import-source.yml

      - name: Publier l'arborescence complète
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publie l'arborescence complète de Synapse by MaTows"
          git push
